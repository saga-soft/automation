name: Lock Threads

on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry Run"
        type: boolean
        default: false

concurrency:
  group: lock-threads

jobs:
  lock:
    name: Lock Old Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Lock Inactive Threads
        env:
          GH_TOKEN: ${{ secrets.SAGA_SOFT_BOT_TOKEN }}
        run: |
          uv run lock_threads.py ${{ inputs.dry-run && '--dry-run' || '' }}
